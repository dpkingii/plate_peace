<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlatePeace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">

    <header>
      <div class="brand">
        <!-- Leaf + plate icon (pure SVG, no file needed) -->
        <svg class="brand-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="22" r="13" fill="#e8f0e4" stroke="#7fa688" stroke-width="1.5"/>
          <path d="M20 9 C20 9 13 14 13 20 C13 26 20 28 20 28 C20 28 27 26 27 20 C27 14 20 9 20 9Z" fill="#7fa688" opacity="0.25"/>
          <path d="M20 10 C20 10 14.5 15 14.5 20.5 C14.5 25 20 27 20 27" stroke="#4a7c5f" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <path d="M20 10 C20 10 17 17 20 22" stroke="#4a7c5f" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">Plate Peace</span>
          <span class="brand-tagline">Browse menus with ease</span>
        </div>
      </div>
    </header>

    <div class="divider"></div>

    <!-- Main toggle -->
    <div class="row" id="mainRow">
      <div class="row-text">
        <span class="row-label">Hide calorie numbers</span>
        <span class="row-desc" id="mainDesc">Numbers are visible</span>
      </div>
      <button
        class="toggle"
        id="mainToggle"
        aria-pressed="false"
        aria-label="Toggle calorie filter"
      >
        <span class="thumb"></span>
      </button>
    </div>

    <div class="divider"></div>

    <footer>
      You deserve to enjoy your food.
    </footer>

  </div>
  <script src="scripts.js"></script>
</body>
</html>
